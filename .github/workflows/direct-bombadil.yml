name: Direct Bombadil discovery

on:
  # The weekly schedule is paused: every run since 2026-08-30 fails inside
  # @hraness/direct's download-provenance check ("Bombadil Chrome download
  # completion downloads/<uuid> lacks live partial provenance"), on 0.7.13 and
  # 0.7.23 alike, before any campaign explores. Restore `schedule:
  # - cron: "17 9 * * 1"` once a dispatched run is green.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: direct-bombadil-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Restore Bun package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Allocate a unique public-summary leaf
        id: bombadil-artifact
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(bun -e 'console.log(crypto.randomUUID())')"
          if [[ ! "$run_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
            echo "Bun did not produce a lowercase RFC 4122 UUID." >&2
            exit 1
          fi
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
      - name: Explore every Direct homepage world
        env:
          DIRECT_BOMBADIL_RUN_ID: ${{ steps.bombadil-artifact.outputs.run_id }}
        run: bun run fuzz:direct -- --time-limit 60s
      - name: Preserve sanitized Bombadil receipts and summaries
        if: ${{ always() && steps.bombadil-artifact.outputs.run_id != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: direct-bombadil-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/direct-bombadil-upload/${{ steps.bombadil-artifact.outputs.run_id }}
          if-no-files-found: error
          retention-days: 14
